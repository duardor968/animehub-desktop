# Linux CI in the KVM8 Woodpecker (https://ci.asrlabs.space): the toolchain of
# scripts/linux-build.Dockerfile, Qt from aqt. Windows (ci.yml) and the releases
# (release.yml) stay on GitHub Actions.
when:
  - event: push
    branch: [main, dev]
  - event: pull_request

steps:
  linux:
    image: ubuntu:24.04
    environment:
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update -qq
      # The .deb files live in the agent's persistent cache (/ci-cache), one apt at a time under a
      # lock; autoclean drops versions the archive no longer has. The log keeps apt's download line.
      - export APT_CACHE=/ci-cache/apt/ubuntu-24.04
      - mkdir -p "$${APT_CACHE}/partial"
      - >-
        flock "$${APT_CACHE}.lock" sh -c 'apt-get install -y -q --no-install-recommends
        -o Dir::Cache::Archives="$${APT_CACHE}" g++-14 gcc-14 ninja-build pkg-config git
        ca-certificates curl xz-utils python3-venv libgl-dev libegl-dev libxkbcommon-dev
        libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 libxcb-cursor0
        libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
        libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 libx11-xcb1 libxrender1 libxi6 libsm6 libice6
        libssl-dev libsecret-1-dev mpv aria2 fonts-dejavu-core dbus dbus-x11 gnome-keyring ccache
        >/tmp/apt.log && apt-get autoclean -qq -o Dir::Cache::Archives="$${APT_CACHE}"'
        || { cat /tmp/apt.log; exit 1; }
      - grep -E '^(Need to get|Fetched)' /tmp/apt.log || echo "apt downloaded nothing"
      - export PIP_CACHE_DIR=/ci-cache/pip
      - python3 -m venv /opt/venv && /opt/venv/bin/pip install -q cmake==4.4.2 aqtinstall==3.3.0
      - export PATH=/opt/venv/bin:$${PATH}
      # Qt and the compiler cache live in the agent's persistent cache (/ci-cache). Qt installs once per
      # version and modules, under a lock and with a completion mark, so concurrent builds never see half of it.
      - export QT_DIR=/ci-cache/qt/6.11.0-linux_gcc_64-qtimageformats
      - mkdir -p /ci-cache/qt
      - >-
        flock /ci-cache/qt/.lock sh -c 'test -f "$${QT_DIR}/.complete" || { rm -rf "$${QT_DIR}" &&
        aqt install-qt linux desktop 6.11.0 linux_gcc_64 -m qtimageformats -O "$${QT_DIR}" >/dev/null &&
        touch "$${QT_DIR}/.complete"; }'
      - export CCACHE_DIR=/ci-cache/ccache/animehub-desktop CCACHE_BASEDIR="$${CI_WORKSPACE}" CCACHE_MAXSIZE=5G
      - export CMAKE_CXX_COMPILER_LAUNCHER=ccache CMAKE_C_COMPILER_LAUNCHER=ccache
      - CXX=g++-14 QT_ROOT="$${QT_DIR}/6.11.0/gcc_64" cmake --fresh --preset linux-debug
      # The step gets 4 CPUs and 8 GB of the agent, not the host's 8.
      - cmake --build --preset linux-debug --parallel 4
      - ccache --show-stats
      # A throwaway session bus and keyring (in a folder of its own, so no earlier keyring with
      # another password asks to be unlocked), so the credential test runs too.
      - export XDG_RUNTIME_DIR=$(mktemp -d) && chmod 700 "$${XDG_RUNTIME_DIR}"
      - >-
        XDG_DATA_HOME="$(mktemp -d)" dbus-run-session -- sh -c 'printf ci |
        gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
        ANIMEHUB_TEST_KEYRING=private ctest --preset linux-debug'
