name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 4.5.1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.12.1
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
          use-official: true
          email: ${{ secrets.QT_EMAIL }}
          pw: ${{ secrets.QT_PW }}
      - name: Check formatting
        shell: pwsh
        run: |
          $files = Get-ChildItem src, tests -Recurse -Include *.cpp, *.h | ForEach-Object FullName
          clang-format --dry-run --Werror $files
      - name: Configure
        # clang-tidy runs on Linux in .woodpecker/ci.yaml (avoids windows-2025 VS18 STL1000).
        # Embedded debug info (/Z7) lets sccache cache MSVC objects without shared .pdb locks.
        shell: pwsh
        run: |
          $env:QT_ROOT = $env:QT_ROOT_DIR
          cmake --fresh --preset windows-debug `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset windows-debug
          sccache --show-stats
      - name: Install updater test dependencies
        shell: pwsh
        run: python -m pip install --quiet zstandard cryptography
      - name: Test
        shell: pwsh
        run: ctest --preset windows-debug
